name: ecommerce

services:
  pg-core:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      APP_PASSWORD: ${APP_PASSWORD:-app}
      APP_DATABASES: identity tenant customer product
    command: postgres -c wal_level=replica -c max_wal_senders=10 -c wal_keep_size=512MB
    ports:
      - "5432:5432"
    volumes:
      - pg-core-data:/var/lib/postgresql/data
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-primary-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-core-replica:
    image: postgres:17
    user: postgres
    entrypoint: ["bash", "/scripts/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: pg-core
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    ports:
      - "5433:5432"
    volumes:
      - pg-core-replica-data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    depends_on:
      pg-core:
        condition: service_healthy

volumes:
  pg-core-data:
  pg-core-replica-data: