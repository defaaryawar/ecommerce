name: ecommerce

services:
  # ===== Postgres cluster 1: core (baca berat) =====
  pg-core:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      APP_PASSWORD: ${APP_PASSWORD:-app}
      APP_DATABASES: identity tenant customer product
    command: postgres -c wal_level=replica -c max_wal_senders=10 -c wal_keep_size=512MB
    ports:
      - "5432:5432"
    volumes:
      - pg-core-data:/var/lib/postgresql/data
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-primary-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-core-replica:
    image: postgres:17
    user: postgres
    entrypoint: ["bash", "/scripts/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: pg-core
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    ports:
      - "5433:5432"
    volumes:
      - pg-core-replica-data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    depends_on:
      pg-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ===== Postgres cluster 2: txn (tulis berat) =====
  pg-txn:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      APP_PASSWORD: ${APP_PASSWORD:-app}
      APP_DATABASES: orders inventory payment fraud audit
    command: postgres -c wal_level=replica -c max_wal_senders=10 -c wal_keep_size=512MB
    ports:
      - "5442:5432"
    volumes:
      - pg-txn-data:/var/lib/postgresql/data
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-primary-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-txn-replica:
    image: postgres:17
    user: postgres
    entrypoint: ["bash", "/scripts/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: pg-txn
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    ports:
      - "5443:5432"
    volumes:
      - pg-txn-replica-data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    depends_on:
      pg-txn:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ===== Kafka (mode KRaft, tanpa Zookeeper) =====
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  # ===== Lainnya =====
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  pg-core-data:
  pg-core-replica-data:
  pg-txn-data:
  pg-txn-replica-data: