syntax = "proto3";

package identity.v1;

// Auth untuk realm "merchant" (pemilik & staff toko).
// Realm "platform" (tim internal) nanti punya service sendiri.
service MerchantAuthService {
  // Daftar toko baru: bikin user + tenant + membership owner sekaligus.
  rpc RegisterOwner(RegisterOwnerRequest) returns (RegisterOwnerResponse);
  // Login. Kalau user punya >1 toko dan tenant_slug kosong,
  // access_token kosong dan memberships berisi pilihan toko.
  rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterOwnerRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  string store_name = 4;
  string store_slug = 5;
}

message RegisterOwnerResponse {
  string user_id = 1;
  string tenant_id = 2;
  string access_token = 3;
  int64 expires_at_unix = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string tenant_slug = 3;
}

message Membership {
  string tenant_id = 1;
  string tenant_slug = 2;
  string tenant_name = 3;
  string role = 4;
}

message LoginResponse {
  string access_token = 1;
  int64 expires_at_unix = 2;
  string tenant_id = 3;
  repeated Membership memberships = 4;
}